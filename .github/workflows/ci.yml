name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      WEB_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql://qualyra_app:ci_app@localhost:5432/qualyra_gmp
      MIGRATION_DATABASE_URL: postgresql://qualyra_owner:ci_owner@localhost:5432/qualyra_gmp
      SHADOW_DATABASE_URL: postgresql://qualyra_owner:ci_owner@localhost:5432/qualyra_gmp_shadow
      POSTGRES_PORT: 5432
      POSTGRES_DB: qualyra_gmp
      POSTGRES_SHADOW_DB: qualyra_gmp_shadow
      POSTGRES_SUPERUSER_PASSWORD: ci_superuser
      POSTGRES_OWNER_USER: qualyra_owner
      POSTGRES_OWNER_PASSWORD: ci_owner
      POSTGRES_APP_USER: qualyra_app
      POSTGRES_APP_PASSWORD: ci_app
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_UI_PORT: 8025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare validated test configuration
        run: |
          cp .env.example .env
          npm run keys:generate

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Start isolated API dependencies
        run: npm run infra:up

      - name: Apply reviewed migrations
        run: npm run db:migrate:deploy

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Verify committed OpenAPI contract
        run: |
          npm run openapi:generate
          git diff --exit-code -- openapi.json

  database-integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local integration environment
        run: |
          cp .env.example .env
          npm run keys:generate

      - name: Start isolated infrastructure
        run: npm run infra:up

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply reviewed migrations
        run: npm run db:migrate:deploy

      - name: Seed permissions
        run: npm run db:seed

      - name: Verify database isolation and authentication
        run: RUN_DATABASE_INTEGRATION=true npm run test:integration

      - name: Remove ephemeral CI infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
