name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      WEB_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql://qualyra_app:ci_app@localhost:5432/qualyra_gmp
      MIGRATION_DATABASE_URL: postgresql://qualyra_owner:ci_owner@localhost:5432/qualyra_gmp
      SHADOW_DATABASE_URL: postgresql://qualyra_owner:ci_owner@localhost:5432/qualyra_gmp_shadow
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  database-integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local integration environment
        run: cp .env.example .env

      - name: Start isolated infrastructure
        run: npm run infra:up

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply reviewed migrations
        run: npm run db:migrate:deploy

      - name: Seed permissions
        run: npm run db:seed

      - name: Verify database isolation
        run: RUN_DATABASE_INTEGRATION=true npm run test:integration

      - name: Remove ephemeral CI infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
